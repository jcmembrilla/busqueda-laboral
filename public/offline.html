<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sin conexión — Búsqueda Laboral</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: radial-gradient(ellipse at center, #121212, #0f1411, #0a0a0a);
        color: #fff;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        max-width: 360px;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.12);
        border: 2px solid rgba(16, 185, 129, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 36px;
        height: 36px;
        color: #34d399;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.01em;
      }
      p {
        font-size: 0.875rem;
        color: #9ca3af;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #10b981;
        color: #0a0a0a;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 14px 28px;
        border-radius: 16px;
        border: none;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        min-height: 48px;
        touch-action: manipulation;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:hover {
        background: #34d399;
      }
      .btn svg {
        width: 18px;
        height: 18px;
      }
      .status {
        margin-top: 24px;
        font-size: 0.75rem;
        color: #6b7280;
        transition: color 0.3s;
      }
      .status.online {
        color: #34d399;
      }
      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(10, 10, 10, 0.3);
        border-top-color: #0a0a0a;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      .loading .spinner {
        display: inline-block;
      }
      .loading .btn-text {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0"
          />
          <circle cx="12" cy="18.75" r="0.75" fill="currentColor" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Verificá tu señal y volvé a intentar.</p>
      <button class="btn" id="btn-retry" type="button">
        <svg
          class="btn-text"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"
          />
        </svg>
        <span class="spinner"></span>
        <span class="btn-text">Reintentar</span>
      </button>
      <p class="status" id="status">Esperando conexión...</p>
    </div>
    <script>
      var btn = document.getElementById('btn-retry')
      var status = document.getElementById('status')
      var reintentosAutomaticos = 0
      var MAX_REINTENTOS_AUTOMATICOS = 2

      btn.addEventListener('click', function () {
        btn.classList.add('loading')
        window.location.reload()
      })

      function probarConexion() {
        // Sonda de red real: URL con query única para que el SW no pueda
        // responder desde cache. Si la red está caída, el fetch falla.
        return new Promise(function (resolve) {
          var controlador = new AbortController()
          var timer = setTimeout(function () {
            controlador.abort()
            resolve(false)
          }, 4000)
          fetch('/manifest.json?sondeo=' + Date.now(), {
            cache: 'no-store',
            signal: controlador.signal,
          })
            .then(function (res) {
              resolve(res && res.ok)
            })
            .catch(function () {
              resolve(false)
            })
            .finally(function () {
              clearTimeout(timer)
            })
        })
      }

      window.addEventListener('online', function () {
        if (reintentosAutomaticos >= MAX_REINTENTOS_AUTOMATICOS) {
          status.textContent = '¡Conexión restaurada! Tocá "Reintentar" para cargar la página.'
          status.classList.add('online')
          return
        }
        reintentosAutomaticos++
        status.textContent = '¡Conexión restaurada! Comprobando...'
        status.classList.add('online')
        probarConexion().then(function (hayRed) {
          if (hayRed) {
            status.textContent = '¡Conexión restaurada! Recargando...'
            window.location.reload()
          } else {
            reintentosAutomaticos++
            status.textContent =
              'La señal volvió, pero la página aún no responde. Tocá "Reintentar".'
          }
        })
      })
    </script>
  </body>
</html>
